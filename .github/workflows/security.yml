name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Mondays 06:00 UTC — catches newly disclosed advisories in dependencies.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pip-audit (known CVEs in dependencies)
        # No --strict: the editable install of this project isn't on PyPI and can't be
        # audited, and --strict would treat that skip as a failure. Real vulnerabilities
        # in dependencies still fail this step.
        run: pip-audit --desc
      - name: bandit (static security analysis)
        run: bandit -r wmoop_tools tools -c pyproject.toml --severity-level medium
