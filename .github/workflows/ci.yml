name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format (check only)
        run: ruff format --check .

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests + coverage
        run: pytest --cov=wmoop_tools --cov-report=term-missing --cov-report=xml
      - name: Generators are deterministic & valid
        run: python tools/check_generated.py

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  conformance:
    name: Conformance (pinned wmoop.doc model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # external/wmoop.doc, plus the grammar it pins
          fetch-depth: 0 # full history in the submodule too, for the pin check
      - name: The model pin is a commit on WMOOP/wmoop.doc main
        run: |
          git -C external/wmoop.doc fetch --quiet origin main
          if ! git -C external/wmoop.doc merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::external/wmoop.doc pins a commit that is not on wmoop.doc main"
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (toolchain + the model validator's dependencies)
        run: pip install -e ".[dev]" -r external/wmoop.doc/schema/requirements.txt
      - name: Run conformance suite against the pinned model
        run: python tests/test_conformance.py
      - name: Binding regeneration script and its drift gate, on the pinned model
        run: pytest tests/test_regen_binding.py

  csharp:
    name: C# binding compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # external/wmoop.doc: the pinned canonical model
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Install toolchain
        run: pip install -e .
      - name: Generate the C# binding from the pinned model
        run: python -m wmoop_tools --model external/wmoop.doc/model --lang csharp --out build/cs
      - name: Compile every generated project, warnings as errors (.NET SDK)
        run: dotnet build build/cs/Wmoop.Generated.sln --configuration Release --nologo -warnaserror

  # After a green main, ask every binding to regenerate: their regen.yml moves the pins and opens
  # a "chore(regen): ..." pull request when the toolchain change alters anything they commit.
  notify-bindings:
    name: Ask the bindings to regenerate
    needs: [lint, type-check, test, build, conformance, csharp]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.WMOOP_BOT_APP_ID }}
          private-key: ${{ secrets.WMOOP_BOT_PRIVATE_KEY }}
          owner: WMOOP
          repositories: wmoop.net,wmoop.py
      - name: Send wmoop-upstream-updated to every binding
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for repo in wmoop.net wmoop.py; do
            gh api "repos/WMOOP/$repo/dispatches" -f event_type=wmoop-upstream-updated -f "client_payload[source]=$SOURCE" -f "client_payload[sha]=$SHA"
          done
