name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format (check only)
        run: ruff format --check .

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests + coverage
        run: pytest --cov=wmoop_tools --cov-report=term-missing --cov-report=xml
      - name: Generators are deterministic & valid
        run: python tools/check_generated.py

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  conformance:
    name: Conformance (integration, best-effort)
    runs-on: ubuntu-latest
    # The canonical model lives in a separate repo whose branch may not be public yet,
    # so this job is informational and never blocks the merge. The script skips cleanly
    # (exit 0) when the model cannot be found.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          path: wmoop.tools
      - name: Check out the canonical model (wmoop.doc)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: WMOOP/wmoop.doc
          path: wmoop.doc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wmoop.tools/pyproject.toml
      - name: Install
        working-directory: wmoop.tools
        run: pip install -e ".[dev]"
      - name: Run conformance suite against the real model
        working-directory: wmoop.tools
        env:
          WMOOP_MODEL: ${{ github.workspace }}/wmoop.doc/model
        run: python tests/test_conformance.py

  csharp:
    name: C# binding compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: wmoop.tools
      - name: Check out the canonical model (wmoop.doc)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: WMOOP/wmoop.doc
          path: wmoop.doc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wmoop.tools/pyproject.toml
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Install toolchain
        working-directory: wmoop.tools
        run: pip install -e .
      - name: Generate the C# binding
        working-directory: wmoop.tools
        # Use the canonical model when it checked out; otherwise the bundled fixture,
        # so this job always compiles real generator output.
        run: |
          MODEL="$GITHUB_WORKSPACE/wmoop.doc/model"
          if [ ! -d "$MODEL" ]; then MODEL="tests/fixtures/model"; fi
          echo "Generating C# from model: $MODEL"
          python -m wmoop_tools --model "$MODEL" --lang csharp --out build/cs
      - name: Compile the generated C# (.NET SDK)
        working-directory: wmoop.tools/build/cs/Wmoop.Generated
        run: dotnet build --configuration Release --nologo
