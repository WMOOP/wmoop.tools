[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wmoop-tools"
version = "0.1.0"
description = "The WMOOP toolchain — WML World Model compiler and multi-language code generators."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "WMOOP contributors" }]
keywords = ["wmoop", "wml", "code-generation", "modeling", "toolchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/WMOOP/wmoop.tools"
Documentation = "https://github.com/WMOOP/wmoop.doc"
Source = "https://github.com/WMOOP/wmoop.tools"
Issues = "https://github.com/WMOOP/wmoop.tools/issues"

[project.scripts]
wmoop-tools = "wmoop_tools.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "pre-commit>=3.7",
    "nox>=2024.4.15",
    "build>=1.2",
]

[tool.setuptools.packages.find]
include = ["wmoop_tools*"]
exclude = ["tests*", "tools*", "build*"]

# --------------------------------------------------------------------------- #
# Ruff — linter + formatter (replaces flake8 / isort / black)
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py310"
line-length = 120
# Generated output and test fixtures are not hand-written and must not be linted.
extend-exclude = ["build", "tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "PGH",  # pygrep-hooks (blanket noqa / type-ignore)
    "RUF",  # ruff-specific rules
]
# The formatter owns line length; let long string/URL lines through the linter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert-heavy, less-typed patterns and dynamic imports.
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["wmoop_tools"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# --------------------------------------------------------------------------- #
# mypy — static type checking (pragmatic: adds value, stays green)
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
files = ["wmoop_tools", "tools"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
extra_checks = true
# The package uses untyped dataclass fields (list/dict without params) on purpose;
# we check what is annotated without demanding annotations everywhere yet.
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: end-to-end tests that need the external wmoop.doc model repository",
]

# --------------------------------------------------------------------------- #
# coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
source = ["wmoop_tools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# --------------------------------------------------------------------------- #
# bandit — security linter (see SECURITY.md: generators + untrusted model input)
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["build", "tests", ".venv"]
# The toolchain shells out only with fixed, shell-less argument lists (no user input),
# so the subprocess-import/call advisories are not applicable here.
skips = ["B404", "B603"]
